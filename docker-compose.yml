services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/casevault.db
      UPLOAD_DIR: /app/data/uploads
      DMS_MASTER_KEY: ${DMS_MASTER_KEY:-}
      DMS_SETUP_TOKEN: ${DMS_SETUP_TOKEN:-}
      CORS_ORIGINS: ""
    volumes:
      - casevault-data:/app/data
volumes:
  casevault-data:
